<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Folder placeholder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#7B66B8"/>
      <stop offset="55%" stop-color="#4A3875"/>
      <stop offset="100%" stop-color="#241637"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e6e8ec" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <g id="folder">
      <!-- back panel with tab -->
      <path opacity="0.65" d="M126 176 Q126 158 144 158 H220 Q229 158 235 165 L258 192 Q262 196 268 196 H368 Q386 196 386 214 V342 Q386 360 368 360 H144 Q126 360 126 342 Z"/>
      <!-- front panel -->
      <rect x="126" y="224" width="260" height="136" rx="18" ry="18"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(0 -2)">
    <use href="#folder" fill="#ffffff" opacity="0.35" filter="url(#halo)"/>
    <use href="#folder" fill="url(#smoke)" filter="url(#soft)"/>
  </g>
</svg>
