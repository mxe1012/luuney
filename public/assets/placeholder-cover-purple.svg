<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Music placeholder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#7B66B8"/>
      <stop offset="55%" stop-color="#4A3875"/>
      <stop offset="100%" stop-color="#241637"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e6e8ec" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <g id="note">
      <ellipse cx="190" cy="350" rx="44" ry="33" transform="rotate(-20 190 350)"/>
      <ellipse cx="340" cy="320" rx="44" ry="33" transform="rotate(-20 340 320)"/>
      <rect x="216" y="160" width="22" height="190"/>
      <rect x="366" y="125" width="22" height="195"/>
      <polygon points="216,150 388,114 388,170 216,206"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(-11 7)">
    <use href="#note" fill="#ffffff" opacity="0.35" filter="url(#halo)"/>
    <use href="#note" fill="url(#smoke)" filter="url(#soft)"/>
  </g>
</svg>
