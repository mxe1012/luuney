<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Person placeholder">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#7B66B8"/>
      <stop offset="55%" stop-color="#4A3875"/>
      <stop offset="100%" stop-color="#241637"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e6e8ec" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <g id="person">
      <!-- head -->
      <circle cx="256" cy="205" r="56"/>
      <!-- shoulders: domed on top, gently rounded at the base, separated from the head by a neck gap -->
      <path d="M 141,410 A 115,115 0 0 1 371,410 V 415 A 30,30 0 0 1 341,445 H 171 A 30,30 0 0 1 141,415 Z"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(0 -4)">
    <use href="#person" fill="#ffffff" opacity="0.35" filter="url(#halo)"/>
    <use href="#person" fill="url(#smoke)" filter="url(#soft)"/>
  </g>
</svg>
